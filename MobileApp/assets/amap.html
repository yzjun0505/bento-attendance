<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; img-src * data: blob:; connect-src *;">
  <title>AMap</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body, #mapContainer { width: 100%; height: 100%; overflow: hidden; }
  </style>
</head>
<body>
  <div id="mapContainer"></div>

  <!-- 高德 JS API 2.0 安全密钥配置（必须在加载API之前） -->
  <script type="text/javascript">
    function postFlutterMessage(payload) {
      if (window.FlutterChannel) {
        window.FlutterChannel.postMessage(JSON.stringify(payload));
      }
    }

    function reportMapError(message) {
      postFlutterMessage({
        type: 'mapError',
        message: message || '地图加载失败'
      });
    }

    window._AMapSecurityConfig = {
      securityJsCode: 'c673cb06b1823f9e290ab592a2aeadd7',
    }
  </script>

  <!-- 高德 JS API 2.0 -->
  <script
    type="text/javascript"
    src="https://webapi.amap.com/maps?v=2.0&key=__AMAP_WEB_KEY__&plugin=AMap.Geocoder"
    onerror="reportMapError('高德地图 JS API 加载失败，请检查网络和 AMAP_WEB_KEY')">
  </script>
  <script>
    var map = null;
    var locationMarker = null;
    var locationCircle = null;
    var projectMarkers = [];
    var projectCircles = [];
    var geocoder = null;

    // ====== 初始化地图 ======
    function initMap(centerLng, centerLat, zoom) {
      try {
        if (typeof AMap === 'undefined') {
          reportMapError('高德地图 API 未加载，请检查 AMAP_WEB_KEY 和网络');
          return;
        }

        var mapOpts = {
          zoom: zoom || 15,
          resizeEnable: true,
          rotateEnable: false,
          pitchEnable: false,
          viewMode: '2D',
          mapStyle: 'amap://styles/normal',
          features: ['bg', 'road', 'building', 'point']
        };
        // 只在有有效坐标时设置 center，否则使用高德 IP 定位
        if (centerLng && centerLat) {
          mapOpts.center = [centerLng, centerLat];
        }
        map = new AMap.Map('mapContainer', mapOpts);

        postFlutterMessage({ type: 'mapReady' });

        // 如果没有传入初始坐标，尝试使用高德定位插件获取当前位置
        if (!centerLng || !centerLat) {
          AMap.plugin('AMap.Geolocation', function() {
            var geolocation = new AMap.Geolocation({
              enableHighAccuracy: true,
              timeout: 10000,
              zoomToAccuracy: true,
              showButton: false,
              showMarker: false,
              showCircle: false,
              GeoLocationFirst: true,
              noIpLocate: 0,
              needAddress: false,
              extensions: 'base'
            });
            map.addControl(geolocation);
            geolocation.getCurrentPosition(function(status, result) {
              if (status === 'complete') {
                var lng = result.position.getLng();
                var lat = result.position.getLat();
                map.setCenter([lng, lat]);
                // 通知 Flutter 当前位置
                postFlutterMessage({
                  type: 'ipLocation',
                  longitude: lng,
                  latitude: lat
                });
              }
            });
          });
        }

        geocoder = new AMap.Geocoder({
          radius: 1000,
          extensions: 'base'
        });
      } catch (e) {
        reportMapError(e && e.message ? e.message : '地图初始化失败');
      }
    }

    // ====== 更新用户位置（蓝点 + 精度圈）======
    function updateLocation(lng, lat, accuracy) {
      if (!map) return;
      var pos = [lng, lat];

      if (!locationMarker) {
        // 蓝点
        locationMarker = new AMap.CircleMarker({
          center: pos,
          radius: 8,
          strokeColor: '#fff',
          strokeOpacity: 1,
          strokeWeight: 2,
          fillColor: '#3B82F6',
          fillOpacity: 1,
          zIndex: 200,
          cursor: 'default'
        });
        locationMarker.setMap(map);

        // 精度圈
        locationCircle = new AMap.Circle({
          center: pos,
          radius: Math.max(accuracy || 50, 10),
          strokeColor: '#3B82F6',
          strokeOpacity: 0.3,
          strokeWeight: 1,
          fillColor: '#3B82F6',
          fillOpacity: 0.08,
          zIndex: 190
        });
        locationCircle.setMap(map);
      } else {
        locationMarker.setCenter(pos);
        locationCircle.setCenter(pos);
        locationCircle.setRadius(Math.max(accuracy || 50, 10));
      }
    }

    // ====== 移动到位置 ======
    function moveToLocation(lng, lat, zoom) {
      if (!map) return;
      map.setZoomAndCenter(zoom || 15, [lng, lat]);
    }

    // ====== 更新项目围栏 ======
    function updateProjects(projectsJson) {
      // 清除旧的
      projectMarkers.forEach(function(m) { m.setMap(null); });
      projectCircles.forEach(function(c) { c.setMap(null); });
      projectMarkers = [];
      projectCircles = [];

      if (!map) return;

      var projects;
      try {
        projects = JSON.parse(projectsJson);
      } catch(e) {
        return;
      }

      projects.forEach(function(p) {
        if (!p.longitude || !p.latitude) return;

        var center = [p.longitude, p.latitude];
        var isInside = p.isInside || false;

        // 围栏圈
        var circle = new AMap.Circle({
          center: center,
          radius: p.radius || 500,
          strokeColor: isInside ? '#22C55E' : '#3B82F6',
          strokeOpacity: 0.6,
          strokeWeight: 2,
          strokeStyle: 'dashed',
          fillColor: isInside ? '#22C55E' : '#3B82F6',
          fillOpacity: isInside ? 0.08 : 0.04,
          zIndex: 100
        });
        circle.setMap(map);
        projectCircles.push(circle);

        // 项目标注
        var marker = new AMap.Marker({
          position: center,
          title: p.name,
          offset: new AMap.Pixel(-13, -30),
          content: '<div style="' +
            'background:' + (isInside ? '#22C55E' : '#3B82F6') + ';' +
            'color:#fff;' +
            'padding:4px 10px;' +
            'border-radius:12px;' +
            'font-size:12px;' +
            'font-weight:600;' +
            'white-space:nowrap;' +
            'box-shadow:0 2px 8px rgba(0,0,0,0.15);' +
            '">' + p.name + '</div>',
          zIndex: 150
        });
        marker.setMap(map);
        projectMarkers.push(marker);
      });
    }

    // ====== 逆地理编码 ======
    function reverseGeocode(lng, lat) {
      if (!geocoder) return;
      geocoder.getAddress([lng, lat], function(status, result) {
        if (status === 'complete' && result.info === 'OK') {
          var address = result.regeocode.formattedAddress || '';
          if (window.FlutterChannel) {
            window.FlutterChannel.postMessage(JSON.stringify({
              type: 'address',
              address: address
            }));
          }
        }
      });
    }

    // ====== 设置地图主题 ======
    function setMapStyle(style) {
      if (!map) return;
      if (style === 'dark') {
        map.setMapStyle('amap://styles/dark');
      } else {
        map.setMapStyle('amap://styles/normal');
      }
    }

    // ====== 地图加载完成通知 ======
    window.onload = function() {
      if (typeof AMap === 'undefined') {
        reportMapError('高德地图 API 未加载，请检查 AMAP_WEB_KEY 和网络');
      }
    };
  </script>
</body>
</html>
