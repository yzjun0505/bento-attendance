name: jingmap_app
description: 境图项目协同管理平台
publish_to: 'none'
version: 1.0.14+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  dio: ^5.3.3
  shared_preferences: ^2.2.1
  flutter_secure_storage: ^9.0.0
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  provider: ^6.1.1
  intl: any
  image_picker: ^1.2.1
  image: ^4.1.7
  path_provider: ^2.1.2
  camera: ^0.11.0
  connectivity_plus: ^7.1.0
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0
  open_filex: ^4.7.0
  gal: ^2.3.2
  uuid: ^4.0.0
  table_calendar: ^3.1.2
  webview_flutter: ^4.10.0
  tencent_cloud_chat_sdk: ^8.9.7540
  flutter_local_notifications: ^17.1.2
  tuikit_atomic_x:
    path: ../TUIKit_Flutter/atomic-x
  tencent_chat_uikit:
    path: ../TUIKit_Flutter/chat/uikit
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  # path_provider_foundation 2.6.x pulls objective_c/native hooks into the
  # Android build on Flutter 3.41 and can stall debug APK compilation.
  path_provider_foundation: 2.5.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/amap.html
    - assets/appConfig.json
