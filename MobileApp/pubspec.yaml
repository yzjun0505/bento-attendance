name: jingmap_app
description: 境图 - 极简考勤定位系统
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  dio: ^5.3.3
  shared_preferences: ^2.2.1
  flutter_secure_storage: ^9.0.0
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  provider: ^6.1.1
  intl: any
  image_picker: ^1.2.1
  image: ^4.1.7
  path_provider: ^2.1.2
  camera: ^0.11.0
  connectivity_plus: ^7.1.0
  gal: ^2.3.2
  uuid: ^4.0.0
  table_calendar: ^3.1.2
  webview_flutter: ^4.10.0
  flutter_openim_sdk: ^3.5.1
  flutter_local_notifications: ^17.1.2
  getuiflut: ^0.2.40

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/amap.html
