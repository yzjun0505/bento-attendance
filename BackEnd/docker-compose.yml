version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: checkin_mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: YZ_Jun0505
      MYSQL_DATABASE: checkin_system
      MYSQL_USER: root
      MYSQL_PASSWORD: YZ_Jun0505
      TZ: 'Asia/Shanghai'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - checkin_network
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:

networks:
  checkin_network:
    driver: bridge
